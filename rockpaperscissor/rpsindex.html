<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stonepaperscissor</title>
    <link rel="stylesheet" href="rpsstyle.css">
</head>
<body>
    
        <h1>stone paper scissor</h1>
        <div class="choices">
            <div class="choice" id="rock">
                <img src="rock.jpg" alt="A rock">
            </div>
            <div class="choice" id="paper">
                <img src="paper.jpg" alt="A paper">
            </div>
            <div class="choice" id="scissor">
                <img src="scissor.png" alt ="A scissor">
            </div>
             
        </div>
        <div class="score-board">
            <div class="score">
                <p id="user-score">0</p>
                <p>you</p>
            </div>
            <div class="score">
                <p id="computer-score">0</p>
                <p >computer</p>
            </div>
        </div>
        <div class="msgcontainer">
            <p id="msg">play your move</p>
        </div>
    
    <script src="rpsjavascript.js"></script>
</body>
</html>
